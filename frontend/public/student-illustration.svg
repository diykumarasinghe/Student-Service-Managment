<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1479E8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#1E3A8A" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <rect width="600" height="500" fill="url(#bgGrad)" rx="24"/>

  <!-- Background Decorative Shapes -->
  <circle cx="100" cy="100" r="70" fill="#3B82F6" opacity="0.1"/>
  <circle cx="500" cy="400" r="90" fill="#1D4ED8" opacity="0.08"/>
  <rect x="450" y="60" width="40" height="40" rx="8" fill="#F59E0B" opacity="0.2" transform="rotate(15 470 80)"/>
  
  <!-- Central Portal Card / Laptop Frame -->
  <g filter="url(#shadow)">
    <!-- Base Plate / Desk -->
    <ellipse cx="300" cy="420" rx="220" ry="18" fill="#CBD5E1" opacity="0.6"/>
    
    <!-- Main Dashboard Screen Mockup -->
    <rect x="120" y="100" width="360" height="250" rx="16" fill="#FFFFFF"/>
    <rect x="120" y="100" width="360" height="40" rx="16" fill="url(#primaryGrad)"/>
    <!-- Dots on top bar -->
    <circle cx="145" cy="120" r="5" fill="#EF4444"/>
    <circle cx="160" cy="120" r="5" fill="#F59E0B"/>
    <circle cx="175" cy="120" r="5" fill="#10B981"/>
    
    <!-- Title placeholder bar -->
    <rect x="200" y="115" width="120" height="10" rx="5" fill="#FFFFFF" opacity="0.8"/>

    <!-- Screen Content Mockups -->
    <rect x="140" y="160" width="150" height="70" rx="10" fill="#EFF6FF"/>
    <rect x="155" y="175" width="40" height="40" rx="8" fill="url(#primaryGrad)"/>
    <rect x="205" y="180" width="65" height="10" rx="5" fill="#1E3A8A"/>
    <rect x="205" y="200" width="40" height="8" rx="4" fill="#93C5FD"/>

    <rect x="310" y="160" width="150" height="70" rx="10" fill="#FEF3C7"/>
    <rect x="325" y="175" width="40" height="40" rx="8" fill="url(#accentGrad)"/>
    <rect x="375" y="180" width="65" height="10" rx="5" fill="#78350F"/>
    <rect x="375" y="200" width="40" height="8" rx="4" fill="#FDE68A"/>

    <!-- Table mockup lines -->
    <rect x="140" y="250" width="320" height="80" rx="10" fill="#F8FAFC"/>
    <rect x="155" y="265" width="290" height="10" rx="5" fill="#E2E8F0"/>
    <rect x="155" y="285" width="220" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="155" y="305" width="260" height="10" rx="5" fill="#E2E8F0"/>
  </g>

  <!-- Student Figure with Graduation Cap / Books -->
  <!-- Cap -->
  <polygon points="300,45 360,65 300,85 240,65" fill="#1E293B"/>
  <rect x="280" y="70" width="40" height="20" fill="#1E293B" rx="4"/>
  <line x1="360" y1="65" x2="370" y2="95" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="370" cy="98" r="4" fill="#F59E0B"/>

  <!-- Floating Graduation & Service Badges -->
  <g filter="url(#shadow)">
    <circle cx="90" cy="240" r="30" fill="#10B981"/>
    <path d="M78 240 L86 248 L102 232" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <circle cx="510" cy="220" r="30" fill="#1479E8"/>
    <!-- Document Icon -->
    <rect x="498" y="206" width="24" height="28" rx="3" fill="#FFFFFF"/>
    <line x1="504" y1="214" x2="516" y2="214" stroke="#1479E8" stroke-width="2" stroke-linecap="round"/>
    <line x1="504" y1="220" x2="516" y2="220" stroke="#1479E8" stroke-width="2" stroke-linecap="round"/>
    <line x1="504" y1="226" x2="512" y2="226" stroke="#1479E8" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
